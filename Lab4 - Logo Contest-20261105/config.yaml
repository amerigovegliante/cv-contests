# =============================================================================
# Logo Contest - Configuration (FINAL, mAP 0.822)
# =============================================================================
# All queries use SIFT. The single per-query override is edgeThreshold=15
# for Coca-Cola, which lifted its AP from 0.651 to 0.805 by retaining
# edge features on the script typography.
#
# RANSAC: off. Tested and rejected — it reduced mAP to 0.757 because
# Marlboro's true-positive pairs produce fewer than 4 matches, below
# the minimum required for homography estimation.
# =============================================================================

detector:
  type: SIFT
  nfeatures: 1000
  nOctaveLayers: 15
  contrastThreshold: 0.1
  edgeThreshold: 5
  sigma: 2.0
  root_sift: true

matching:
  ratio_thresh: 0.67
  ransac_reproj_thresh: 5.0
  ransac_min_inliers: 4
  use_ransac: true

queries:

  cocacola:
    detector:
      type: SIFT
      nfeatures: 500            # unlimited
      nOctaveLayers: 15
      contrastThreshold: 0.1
      edgeThreshold: 20       # even more permissive than 15
      sigma: 2.0
    matching:
      ratio_thresh: 0.75

  heineken:
    detector:
      type: SIFT
      nfeatures: 500
      nOctaveLayers: 15
      contrastThreshold: 0.1
      edgeThreshold: 5
      sigma: 2.0
      root_sift: true
    matching:
      ratio_thresh: 0.67
      use_ransac: false

  marlboro:
    detector:
      type: SIFT
      nfeatures: 500
      nOctaveLayers: 15
      contrastThreshold: 0.1
      edgeThreshold: 5
      sigma: 2.0
      root_sift: false
    matching:
      ratio_thresh: 0.67
      use_ransac: false

  starbucks:
    detector:
      type: SIFT
      nfeatures: 500
      nOctaveLayers: 15
      contrastThreshold: 0.1
      edgeThreshold: 5
      sigma: 2.0
      root_sift: false
    matching:
      ratio_thresh: 0.67
      use_ransac: false